{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-secondary small">Log in to your EduLearn account</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-bold mb-0">Password</label>
                            <a href="{% url 'accounts:forgot_password' %}" class="small text-primary text-decoration-none fw-semibold">Forgot Password?</a>
                        </div>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-gradient btn-lg w-100 mb-3">Sign In</button>
                </form>


                <div class="text-center text-secondary small border-top pt-3">
                    Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold text-primary">Sign up as Student</a> or <a href="{% url 'accounts:register_instructor' %}" class="fw-bold text-info">Become Instructor</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
