{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-warning bg-opacity-10 text-warning mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-key fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Forgot Password</h3>
                    <p class="text-secondary small">Enter your email address to receive a 6-digit OTP code.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Registered Email Address *</label>
                        <input type="email" name="email" class="form-control" placeholder="student@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-gradient btn-lg w-100 mb-3">Send OTP Code</button>
                </form>

                <div class="text-center text-secondary small border-top pt-3">
                    Remembered password? <a href="{% url 'accounts:login' %}" class="fw-bold text-primary">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
