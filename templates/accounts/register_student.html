{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-user-plus fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Student Registration</h3>
                    <p class="text-secondary small">Start learning today on EduLearn</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">First Name</label>
                            {{ form.first_name }}
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Last Name</label>
                            {{ form.last_name }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username *</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address *</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password *</label>
                        {{ form.password }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Confirm Password *</label>
                        {{ form.confirm_password }}
                    </div>
                    <button type="submit" class="btn btn-gradient btn-lg w-100 mb-3">Create Student Account</button>
                </form>

                <div class="text-center text-secondary small border-top pt-3">
                    Already have an account? <a href="{% url 'accounts:login' %}" class="fw-bold text-primary">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
