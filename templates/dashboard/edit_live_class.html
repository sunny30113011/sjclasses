{% extends 'base.html' %}

{% block content %}
<div class="bg-dark text-white py-4 mb-4" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-video text-danger me-2"></i> Edit Live Class Session</h2>
            <p class="text-secondary small mb-0">Update the live session title, scheduled date, duration, meeting link and active status</p>
        </div>
        <a href="{% url 'dashboard:course_builder' %}" class="btn btn-outline-light btn-sm">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Builder
        </a>
    </div>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg p-4 rounded-4">
                <div class="mb-3 p-3 bg-light rounded-3">
                    <small class="text-muted d-block"><i class="fa-solid fa-book-open text-primary me-1"></i> Course: <strong>{{ live_class.course.title }}</strong></small>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Session Title *</label>
                        <input type="text" name="title" class="form-control" value="{{ live_class.title }}" placeholder="e.g. Q&A and Project Code Review" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Date & Time *</label>
                            <input type="datetime-local" name="scheduled_at" class="form-control" value="{{ live_class.scheduled_at|date:'Y-m-d\TH:i' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Duration (Minutes) *</label>
                            <input type="number" name="duration_minutes" class="form-control" value="{{ live_class.duration_minutes }}" min="5" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Meeting Link (Zoom / GMeet / Jitsi) *</label>
                        <input type="url" name="meeting_link" class="form-control" value="{{ live_class.meeting_link }}" placeholder="https://meet.google.com/..." required>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if live_class.is_active %}checked{% endif %}>
                        <label class="form-check-label fw-bold" for="isActive">
                            <i class="fa-solid fa-toggle-on text-success me-1"></i> Session Active (Visible to Students)
                        </label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'dashboard:delete_live_class' live_class_id=live_class.id %}" 
                           onclick="return confirm('Are you sure you want to delete the live class: {{ live_class.title }}?');"
                           class="btn btn-outline-danger">
                            <i class="fa-solid fa-trash me-1"></i> Delete Session
                        </a>
                        <button type="submit" class="btn btn-danger fw-bold px-4">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
