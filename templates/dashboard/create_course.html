{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg p-4">
                <h3 class="fw-bold mb-3"><i class="fa-solid fa-plus-circle text-primary me-2"></i> Create New Course</h3>
                <p class="text-secondary small mb-4">Fill in basic information about your new course.</p>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Course Title *</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Master Django 5 & REST APIs" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Category</label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Level</label>
                            <select name="level" class="form-select">
                                <option value="All Levels">All Levels</option>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Original Price (₹)</label>
                            <input type="number" step="0.01" name="price" class="form-control" placeholder="1999" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Discounted Selling Price (₹)</label>
                            <input type="number" step="0.01" name="discount_price" class="form-control" placeholder="499" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Short Description *</label>
                        <input type="text" name="short_description" class="form-control" placeholder="Brief 1-line summary for cards" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Course Description *</label>
                        <textarea name="description" class="form-control" rows="5" placeholder="Detailed syllabus, requirements, what students will learn..." required></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Upload Thumbnail</label>
                            <input type="file" name="thumbnail" class="form-control" accept="image/*">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Online Image URL</label>
                            <input type="url" name="online_thumbnail_url" class="form-control" placeholder="https://images.unsplash.com/...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Preview Video Embed URL</label>
                            <input type="url" name="preview_video_url" class="form-control" placeholder="https://www.youtube.com/embed/...">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'dashboard:instructor_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-gradient">Save & Continue to Syllabus <i class="fa-solid fa-arrow-right ms-1"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
