{% extends 'base.html' %}

{% block content %}
<div class="bg-dark text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold mb-1"><i class="fa-solid fa-code me-2 text-warning"></i> Online Coding Compiler</h2>
            <p class="text-secondary small mb-0">Write, test, and execute Python & JavaScript code right in your browser!</p>
        </div>
        <div class="d-flex gap-2">
            <select id="languageSelect" class="form-select form-select-sm bg-secondary text-white border-0" onchange="changeLanguage()">
                <option value="python">Python 3</option>
                <option value="javascript">JavaScript (Node.js)</option>
                <option value="html">HTML / CSS Live Preview</option>
            </select>
            <button type="button" class="btn btn-success btn-sm fw-bold px-3" onclick="runCode()">
                <i class="fa-solid fa-play me-1"></i> Run Code
            </button>
        </div>
    </div>
</div>

<div class="container-fluid px-4 mb-5">
    <div class="row g-3">
        <!-- Code Editor Area -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-lg bg-dark text-white overflow-hidden">
                <div class="card-header bg-black text-secondary d-flex justify-content-between align-items-center py-2 px-3 small">
                    <span><i class="fa-solid fa-terminal me-2"></i> main.<span id="fileExt">py</span></span>
                    <button class="btn btn-sm text-secondary p-0" onclick="clearEditor()"><i class="fa-solid fa-rotate-left me-1"></i> Clear</button>
                </div>
                <div class="card-body p-0">
                    <textarea id="codeEditor" class="form-control bg-dark text-light border-0 font-monospace p-3" rows="18" style="font-size: 14px; line-height: 1.5; resize: vertical;" spellcheck="false"># Write your Python 3 code here
def greet(name):
    return f"Hello {name}, welcome to SJ TECH CLASSES Online Compiler!"

print(greet("Rahul"))
print("Calculated sum 1..100:", sum(range(1, 101)))
</textarea>
                </div>
            </div>
        </div>

        <!-- Terminal Output Area / HTML Preview -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-lg bg-black text-white h-100">
                <div class="card-header bg-dark text-secondary d-flex justify-content-between align-items-center py-2 px-3 small">
                    <span class="fw-bold text-info"><i class="fa-solid fa-display me-2"></i> Execution Output</span>
                    <span id="statusBadge" class="badge bg-secondary">Ready</span>
                </div>
                <div class="card-body p-3 font-monospace overflow-auto" id="outputConsole" style="min-height: 380px; font-size: 13px; color: #4ade80; background: #050505;">
                    <span class="text-secondary">> Click "Run Code" to execute script...</span>
                </div>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
<script>
const sampleCodes = {
    python: `# Python 3 Code Example\ndef greet(name):\n    return f"Hello {name}, welcome to SJ TECH CLASSES Online Compiler!"\n\nprint(greet("Rahul"))\nprint("Calculated sum 1..100:", sum(range(1, 101)))`,
    javascript: `// JavaScript Code Example\nfunction calculateFactorial(n) {\n    if (n === 0 || n === 1) return 1;\n    return n * calculateFactorial(n - 1);\n}\n\nconsole.log("Factorial of 5 is:", calculateFactorial(5));\nconsole.log("Welcome to SJ TECH CLASSES Compiler!");`,
    html: `<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: Arial; text-align: center; padding: 20px; background: #0f172a; color: white; }\n    h1 { color: #fbbf24; }\n  </style>\n</head>\n<body>\n  <h1>SJ TECH CLASSES</h1>\n  <p>Live HTML / CSS Web Preview</p>\n</body>\n</html>`
};

let pyodideInstance = null;
let pyodideLoading = false;

function changeLanguage() {
    const lang = document.getElementById("languageSelect").value;
    document.getElementById("codeEditor").value = sampleCodes[lang];
    document.getElementById("fileExt").innerText = lang === 'python' ? 'py' : (lang === 'javascript' ? 'js' : 'html');
    document.getElementById("outputConsole").innerHTML = '<span class="text-secondary">> Language switched to ' + lang + '. Click "Run Code"...</span>';
}

function clearEditor() {
    document.getElementById("codeEditor").value = "";
}

async function runCode() {
    const lang = document.getElementById("languageSelect").value;
    const code = document.getElementById("codeEditor").value;
    const consoleDiv = document.getElementById("outputConsole");
    const badge = document.getElementById("statusBadge");

    badge.className = "badge bg-warning text-dark";
    badge.innerText = "Executing...";
    consoleDiv.innerHTML = '<span class="text-info">> Compiling & Executing code...</span><br>';

    if (lang === 'javascript') {
        try {
            let logs = [];
            const originalLog = console.log;
            console.log = function(...args) {
                logs.push(args.join(' '));
                originalLog.apply(console, args);
            };

            new Function(code)();
            console.log = originalLog;

            badge.className = "badge bg-success";
            badge.innerText = "Success (200 OK)";
            consoleDiv.innerHTML = logs.map(l => '<div class="text-success">> ' + l + '</div>').join('') || '<span class="text-muted">> (No output returned)</span>';
        } catch (err) {
            badge.className = "badge bg-danger";
            badge.innerText = "Error";
            consoleDiv.innerHTML = '<div class="text-danger">> Uncaught Error: ' + err.message + '</div>';
        }
    } else if (lang === 'html') {
        badge.className = "badge bg-success";
        badge.innerText = "Rendered";
        consoleDiv.innerHTML = '<iframe srcdoc="' + code.replace(/"/g, '&quot;') + '" style="width:100%; height:320px; border:0; background:white; border-radius:6px;"></iframe>';
    } else {
        // Python WebAssembly-based Real Execution using Pyodide
        if (!pyodideInstance) {
            if (pyodideLoading) {
                consoleDiv.innerHTML = '<span class="text-info">> Waiting for Python WebAssembly engine to load...</span>';
                while (pyodideLoading) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            } else {
                pyodideLoading = true;
                consoleDiv.innerHTML = '<span class="text-info">> Loading Python WASM Engine (Pyodide v0.26.1)...</span><br><span class="text-muted">> This might take a few seconds on the first run.</span>';
                try {
                    pyodideInstance = await loadPyodide();
                    pyodideLoading = false;
                    consoleDiv.innerHTML = '<span class="text-success">> Python Engine loaded successfully! Executing script...</span><br>';
                } catch (err) {
                    pyodideLoading = false;
                    badge.className = "badge bg-danger";
                    badge.innerText = "Engine Error";
                    consoleDiv.innerHTML = '<div class="text-danger">> Failed to load Python Engine: ' + err.message + '</div>';
                    return;
                }
            }
        }

        try {
            let stdoutBuffer = [];
            pyodideInstance.setStdout({
                batched: (text) => {
                    stdoutBuffer.push(text);
                }
            });
            pyodideInstance.setStderr({
                batched: (text) => {
                    stdoutBuffer.push(text);
                }
            });

            await pyodideInstance.runPythonAsync(code);

            badge.className = "badge bg-success";
            badge.innerText = "Success (200 OK)";

            let output = stdoutBuffer.join('\n');
            if (output) {
                // escape html
                let escapedOutput = output
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
                consoleDiv.innerHTML = escapedOutput.split('\n').map(l => '<div class="text-success">> ' + l + '</div>').join('');
            } else {
                consoleDiv.innerHTML = '<span class="text-muted">> (Code ran successfully, but returned no output)</span>';
            }
        } catch (err) {
            badge.className = "badge bg-danger";
            badge.innerText = "Runtime Error";
            let escapedErr = err.message
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            consoleDiv.innerHTML = '<div class="text-danger">> ' + escapedErr.replace(/\n/g, '<br>> ') + '</div>';
        }
    }
}
</script>
{% endblock %}
{% endblock %}
