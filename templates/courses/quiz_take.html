{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg p-4">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <div>
                        <span class="badge bg-warning text-dark mb-1">MCQ Examination</span>
                        <h3 class="fw-bold mb-0">{{ quiz.title }}</h3>
                    </div>
                    <span class="badge bg-secondary">Passing Score: {{ quiz.pass_percentage }}%</span>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    {% for q in questions %}
                        <div class="mb-4 p-3 bg-light rounded-3 border">
                            <h5 class="fw-semibold text-dark mb-3">Q{{ forloop.counter }}. {{ q.question_text }}</h5>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_a" value="A" required>
                                <label class="form-check-label w-100" for="q_{{ q.id }}_a">A) {{ q.option_a }}</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_b" value="B">
                                <label class="form-check-label w-100" for="q_{{ q.id }}_b">B) {{ q.option_b }}</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_c" value="C">
                                <label class="form-check-label w-100" for="q_{{ q.id }}_c">C) {{ q.option_c }}</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_d" value="D">
                                <label class="form-check-label w-100" for="q_{{ q.id }}_d">D) {{ q.option_d }}</label>
                            </div>
                        </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{% url 'courses:lesson_player' course_slug=course.slug %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-gradient btn-lg">Submit Exam Answers</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
