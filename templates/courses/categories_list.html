{% extends 'base.html' %}

{% block content %}
<div class="bg-dark text-white py-4 mb-4">
    <div class="container text-center">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-shapes me-2 text-info"></i> Course Categories</h2>
        <p class="text-secondary small mb-0">Browse all learning domains and career paths</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4">
        {% for cat in categories %}
            <div class="col-md-6 col-lg-3">
                <a href="{% url 'courses:course_list' %}?category={{ cat.slug }}" class="card border-0 shadow-sm text-center p-4 text-decoration-none text-dark hover-top h-100">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fa-solid {{ cat.icon }} fs-2"></i>
                    </div>
                    <h5 class="fw-bold mb-2">{{ cat.name }}</h5>
                    <p class="text-secondary small mb-3">{{ cat.description }}</p>
                    <div class="mt-auto">
                        <span class="badge bg-primary rounded-pill px-3 py-2">{{ cat.courses.count }} Courses</span>
                    </div>
                </a>
            </div>
        {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-secondary">No categories created yet.</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
